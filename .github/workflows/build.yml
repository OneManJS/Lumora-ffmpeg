name: build

on:
  push:
    paths: ["scripts/**", "tests/**", ".github/workflows/**"]
  pull_request:
    paths: ["scripts/**", "tests/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      ffmpeg_ref:
        description: "FFmpeg 上游 tag / branch / commit（8.x 无 dovi_split）"
        required: true
        default: "n9.0.2"
        type: string
      publish:
        description: "三平台验收通过后发布 GitHub Release"
        required: false
        default: false
        type: boolean
  schedule:
    # 每周一北京时间 10:00。
    - cron: "0 2 * * 1"

permissions:
  contents: read

concurrency:
  group: build-media-tools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: 脚本检查与回归测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查 Shell 与 Python
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          shellcheck -x scripts/*.sh
          python3 -m unittest discover -s tests -v

  resolve:
    needs: check
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    name: 解析上游源码
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ffmpeg_ref: ${{ steps.source.outputs.ref }}
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: 选择构建版本
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_REF: ${{ inputs.ffmpeg_ref }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            source scripts/build_common.sh
            validate_ref "$REQUESTED_REF"
            echo "ref=$REQUESTED_REF" >> "$GITHUB_OUTPUT"
          else
            latest=$(git ls-remote --tags --refs https://github.com/FFmpeg/FFmpeg.git \
                | awk -F/ '{print $NF}' | grep -E '^n[0-9]+\.[0-9]+(\.[0-9]+)*$' \
                | sed 's/^n//' | sort -V | tail -1)
            [[ -n "$latest" ]] || { echo "未能解析上游稳定 tag" >&2; exit 1; }
            echo "ref=n$latest" >> "$GITHUB_OUTPUT"
          fi
      - name: 锁定源码 commit 与产物版本
        id: source
        env:
          FFMPEG_REF: ${{ steps.pick.outputs.ref }}
        run: bash scripts/resolve_ffmpeg.sh
      - name: 检查已发布版本
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          skip=false
          if [[ "$EVENT_NAME" == schedule ]]; then
            # API 故障必须报错，不能误判为版本尚未发布。
            releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
                --jq '.[] | select(.draft == false) | .tag_name')
            if grep -Fxq "media-tools-$VERSION" <<< "$releases"; then skip=true; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    name: 构建 ${{ matrix.platform }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runner: ubuntu-latest
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: 构建与验收
        shell: bash
        env:
          FFMPEG_REF: ${{ needs.resolve.outputs.ffmpeg_ref }}
          FFMPEG_COMMIT: ${{ needs.resolve.outputs.commit }}
          FFMPEG_VERSION: ${{ needs.resolve.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          set -o pipefail
          bash scripts/build_media_tools.sh 2>&1 | tee "dist/build.${PLATFORM}.log"
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: media-tools-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.*.txt
            dist/config.*.log
            dist/build-info.*.txt
          if-no-files-found: error
          retention-days: 30
      - name: 保留诊断日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.platform }}
          path: |
            dist/build.*.log
            dist/logs.*/**
          retention-days: 14

  build-windows:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    name: 构建 win_x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: 安装 MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make nasm zip unzip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-libvpl
            mingw-w64-ucrt-x86_64-libplacebo
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-amf-headers
            mingw-w64-ucrt-x86_64-libass
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-fontconfig
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-fribidi
            mingw-w64-ucrt-x86_64-x264
            mingw-w64-ucrt-x86_64-x265
            mingw-w64-ucrt-x86_64-svt-av1
            mingw-w64-ucrt-x86_64-zimg
            mingw-w64-ucrt-x86_64-dav1d
            mingw-w64-ucrt-x86_64-libbluray
            mingw-w64-ucrt-x86_64-chromaprint
            mingw-w64-ucrt-x86_64-libssh
            mingw-w64-ucrt-x86_64-libiconv
            mingw-w64-ucrt-x86_64-zlib
      - name: 构建与验收
        shell: msys2 {0}
        env:
          FFMPEG_REF: ${{ needs.resolve.outputs.ffmpeg_ref }}
          FFMPEG_COMMIT: ${{ needs.resolve.outputs.commit }}
          FFMPEG_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          mkdir -p dist
          set -o pipefail
          bash scripts/build_media_tools_win.sh 2>&1 | tee dist/build.win_x64.log
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: media-tools-win_x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.*.txt
            dist/config.*.log
            dist/build-info.*.txt
          if-no-files-found: error
          retention-days: 30
      - name: 保留诊断日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-win_x64
          path: |
            dist/build.*.log
            dist/logs.*/**
          retention-days: 14

  release:
    needs: [resolve, build-linux, build-windows]
    if: >-
      needs.resolve.outputs.skip != 'true' &&
      (inputs.publish || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: media-tools-*
          path: dist
          merge-multiple: true
      - name: 校验完整产物并合并校验和
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          cd dist
          for platform in linux_amd64 linux_arm64 win_x64; do
            test -s "ffmpeg_${VERSION}_${platform}.zip"
            test -s "ffprobe_${VERSION}_${platform}.zip"
            grep -Fx "ffmpeg_commit=$COMMIT" "build-info.$platform.txt"
            grep -Fx "version=$VERSION" "build-info.$platform.txt"
            sha256sum -c "SHA256SUMS.$platform.txt"
          done
          cat SHA256SUMS.*.txt | sort > SHA256SUMS.txt
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          gh release create "media-tools-$VERSION" --repo "$GITHUB_REPOSITORY" --target "$TARGET" \
            --title "media-tools $VERSION" \
            --notes "自建 ffmpeg/ffprobe，三平台使用同一上游 commit。构建来源、依赖版本和 configure 日志见附件，集成步骤见 README.md。" \
            dist/*.zip dist/SHA256SUMS.txt dist/config.*.log dist/build-info.*.txt
